services:
  rstudio:
    image: lorenzopari/test_pristar:0.4
    container_name: pristar-geospec
    ports: ["${PORT_rstudio}:8787"]
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT}
          cpus: ${CPUS}
    mem_swappiness: 0
    environment:
      DISABLE_AUTH: true
      ROOT: true
      N_CPUS: ${CPUS}
      USERID: ${PUID:-1000}
      GROUPID: ${PGID:-1000}
    volumes:
      - ${IMAGES_PATH}:/space
      - ${CONFIG_PATH}:/config_folder
    command: /init
    networks: [PRISTAR_net]

  isofit:
    image: lorenzopari/isofit-api:4.0.0
    container_name: PRISTAR_isofit
    user: "0:${PGID:-1000}"
    command: ["bash", "-c", "umask 002 && exec uvicorn api:app --host 0.0.0.0 --port 8000 --app-dir /root"]
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT}
          cpus: ${CPUS}
    mem_swappiness: 0
    environment:
      N_CPUS: ${CPUS}
    volumes:
      - ${IMAGES_PATH}:/space
      - ${CONFIG_PATH}:/config_folder
    networks: [PRISTAR_net]
      
  arosics:
    image: lorenzopari/arosics:1.13.2
    container_name: PRISTAR_arosics
    user: "${PUID:-1000}:${PGID:-1000}"
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT}
          cpus: ${CPUS}
    mem_swappiness: 0
    environment:
      N_CPUS: ${CPUS}
    volumes:
      - ${IMAGES_PATH}:/space
      - ${CONFIG_PATH}:/config_folder 
    networks: [PRISTAR_net]    
      
      
networks:
  PRISTAR_net: